name: API Tests - Newman

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # Checkout
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # Node.js
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # =========================
      # Backend
      # =========================
      - name: Install backend dependencies
        working-directory: eshop/backend
        run: npm ci

      - name: Start backend
        working-directory: eshop/backend
        run: |
          npm start > backend.log 2>&1 &

      - name: Wait for backend
        run: |
          echo "Waiting for backend..."

          for i in {1..30}; do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "Backend is running!"
              exit 0
            fi

            echo "Backend is not ready yet..."
            sleep 2
          done

          echo "Backend failed to start."
          echo "========== Backend log =========="
          cat eshop/backend/backend.log
          exit 1

      # =========================
      # Newman
      # =========================
      - name: Install Newman and HTML Extra Reporter
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra

      - name: Create reports directory
        run: mkdir -p reports

      # =========================
      # FR10 - Cancel Order
      # =========================
      - name: Run FR10 - Cancel Order
        run: |
          newman run Collections_And_Scripts/FR10_Cancel_Order.postman_collection.json \
            -e Collections_And_Scripts/FR10_Local.postman_environment.json \
            -r cli,htmlextra \
            --reporter-htmlextra-export reports/FR10_Cancel_Order_Report.html

      # =========================
      # Upload reports
      # =========================
      - name: Upload Newman Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-api-reports
          path: reports/